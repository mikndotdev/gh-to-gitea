name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.mikandev.com
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_TOKEN }}

      - name: Build and push (AMD64)
        uses: useblacksmith/build-push-action@v2
        with:
          platforms: linux/amd64
          context: .
          push: true
          tags: |
            cr.mikandev.com/${{ github.repository }}:latest-amd
            cr.mikandev.com/${{ github.repository }}:${{ github.sha }}-amd

  build-arm64:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.mikandev.com
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_TOKEN }}

      - name: Build and push (ARM64)
        uses: useblacksmith/build-push-action@v2
        with:
          platforms: linux/arm64
          context: .
          push: true
          tags: |
            cr.mikandev.com/${{ github.repository }}:latest-arm
            cr.mikandev.com/${{ github.repository }}:${{ github.sha }}-arm

  build-merge:
    runs-on: ubuntu-latest

    needs:
      - build-amd64
      - build-arm64

    steps:
      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: cr.mikandev.com
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_TOKEN }}

      - name: Merge
        run: |
          docker buildx imagetools create -t cr.mikandev.com/${{ github.repository }}:latest \
              cr.mikandev.com/${{ github.repository }}:latest-amd \
              cr.mikandev.com/${{ github.repository }}:latest-arm
